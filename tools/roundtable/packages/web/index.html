<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Citadel — private operator control plane for live agent sessions" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preload" href="/fonts/Tanker-400.woff2" as="font" type="font/woff2" crossorigin />
  <title>Citadel</title>
  <script>
    /* Set the theme before first paint so there is no light/dark flash. */
    (function () {
      try {
        var t = localStorage.getItem('citadel-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
