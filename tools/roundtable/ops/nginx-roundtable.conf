# Roundtable vhost for the box's Dockerised nginx-brotli image.
#
# Subdomain, NOT spoares.com/roundtable. Evidence, 2026-07-25:
#   - roundtable.spoares.com already resolves and returns 200 (falls through to the default
#     server today), so no DNS record is needed.
#   - The spoares.com certificate is a wildcard — SAN: *.spoares.com, spoares.com — so no new
#     certificate is needed either.
# A path mount would cost more, not less: the __Host- cookie prefix requires Path=/, so a hub at
# /roundtable would either leak its session cookie across the whole host or give up the __Host-
# guarantees; the PWA's service worker would share a scope with the memory dashboard; and it would
# mean editing life-dashboard.conf, which is live. This conf is purely additive.
#
# ⛔ BEFORE ANY REBUILD: this file must be COPY'd in ~/sites/nginx/Dockerfile. The image bakes
# confs in rather than mounting them, so a conf present on disk but absent from the Dockerfile is
# silently dropped and its domain falls through to the default server (damneddesigns). Verify:
#
#   for f in ~/sites/nginx/*.conf; do b=$(basename "$f"); \
#     grep -q "COPY $b " ~/sites/nginx/Dockerfile && echo "IN $b" || echo "MISSING $b"; done
#
# Every line must read IN. A MISSING line is a hard stop — add the COPY first.
# The rebuild itself needs Adrian's sudo: the vendure user is not in the docker group.

server {
    listen 443 ssl;
    http2 on;
    server_name roundtable.spoares.com;

    # The existing spoares.com cert is a wildcard (SAN: *.spoares.com, spoares.com), so this
    # subdomain needs no new certificate. Verified 2026-07-25 against the live endpoint.
    ssl_certificate     /etc/letsencrypt/live/spoares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoares.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The hub binds to the Docker gateway, not localhost — the container cannot reach 127.0.0.1.
    set $hub http://172.22.0.1:8460;

    # WebSocket endpoints. Without the Upgrade/Connection pair these silently degrade to a plain
    # request and the node never connects. read_timeout is long because these are idle-held.
    location = /api/events {
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /node/connect {
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset hashes.
    location = / {
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}

server {
    listen 80;
    server_name roundtable.spoares.com;
    return 301 https://$host$request_uri;
}
