[package]
name = "roundtable-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "roundtable_node"
path = "src/lib.rs"

[[bin]]
name = "roundtable-node"
path = "src/main.rs"

[dependencies]
roundtable-protocol = { path = "../roundtable-protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "time", "fs"] }
futures-util = "=0.3.32"
thiserror = "=1.0.69"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "=0.10.9"
async-trait = "=0.1.89"
tracing = "=0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"
