[package]
name = "roundtable-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
roundtable-protocol = { path = "../roundtable-protocol" }
roundtable-store = { path = "../roundtable-store" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
