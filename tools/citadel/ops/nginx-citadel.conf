# Citadel vhost for the box's Dockerised nginx-brotli image.
#
# Subdomain, NOT spoares.com/roundtable. Evidence, 2026-07-25:
#   - citadel.spoares.com already resolves and returns 200 (falls through to the default
#     server today), so no DNS record is needed.
#   - The spoares.com certificate is a wildcard — SAN: *.spoares.com, spoares.com — so no new
#     certificate is needed either.
# The path-mount alternative (spoares.com/roundtable) is genuinely SIMPLER on ops, and that was
# weighed rather than dismissed:
#   - life-dashboard.conf already owns spoares.com and is already COPY'd in the Dockerfile, so a
#     path mount is a one-line location block with NO Dockerfile change — and therefore no
#     exposure to the missing-COPY failure that served damneddesigns on the wrong domain
#     (2026-06-15). This subdomain conf DOES need a new COPY line; run the check above.
#
# It was rejected on one axis only: same origin = shared trust boundary. At spoares.com/roundtable
# the memory dashboard and the hub share an origin, so any XSS on the dashboard can drive the
# Citadel API with the operator's session — and Citadel's session commands agents with shell
# and filesystem access on the Mac and Windows boxes.
#
# Scoping the cookie to Path=/roundtable does NOT fix this: cookie path matching uses the REQUEST
# path, not the page path, so a script on /memory calling fetch('/roundtable/api/...') still sends
# it. There is no cookie configuration that recovers an origin boundary.
#
# Cost of this choice: one extra Dockerfile COPY line, guarded by the verification loop above.
#
# ⛔ BEFORE ANY REBUILD: this file must be COPY'd in ~/sites/nginx/Dockerfile. The image bakes
# confs in rather than mounting them, so a conf present on disk but absent from the Dockerfile is
# silently dropped and its domain falls through to the default server (damneddesigns). Verify:
#
#   for f in ~/sites/nginx/*.conf; do b=$(basename "$f"); \
#     grep -q "COPY $b " ~/sites/nginx/Dockerfile && echo "IN $b" || echo "MISSING $b"; done
#
# Every line must read IN. A MISSING line is a hard stop — add the COPY first.
# The rebuild itself needs Adrian's sudo: the vendure user is not in the docker group.

server {
    # `listen 443 ssl http2;` — the OLD one-line syntax, deliberately. The newer
    # `listen 443 ssl;` + `http2 on;` pair needs nginx >= 1.25.1, and this box's
    # macbre/nginx-brotli image is older: it fails `nginx -t`, so the container exits on
    # startup and takes EVERY site on this box down with it, not just this one. That happened
    # on 2026-07-26 (rottenhand.com and heardright.app served 521 until it was reverted).
    # Every other conf here uses this form; match them.
    listen 443 ssl http2;
    server_name citadel.spoares.com;

    # Origin lock. Cloudflare Access is enforced at THEIR edge, so a request arriving straight at
    # this box never passed through Access at all. Measured 2026-07-26:
    # `curl -k --resolve citadel.spoares.com:443:5.78.82.156 https://citadel.spoares.com/`
    # returned 200, while the same URL through Cloudflare returned 302 to the Access login. Only
    # the hub's own admin login was stopping /api/rooms on that path.
    #
    # This box already solves that: `cloudflare-origin-lock.conf` defines `$cf_ok` in the http
    # context via `geo $realip_remote_addr` (the ORIGINAL peer — the CF edge — not $remote_addr),
    # and `cf-enforce.inc` is a one-line `if ($cf_ok = 0) { return 403; }`. Every other vhost on
    # the box includes it — coderight, damneddesigns, heardright, mailright, rottenhand,
    # scraperight, storefront, viewright and the rest. Citadel was the ONLY one that did not,
    # which is the entire reason it was reachable directly.
    include /etc/nginx/conf.d/cf-enforce.inc;  # origin-lock: 403 non-Cloudflare hits

    # The existing spoares.com cert is a wildcard (SAN: *.spoares.com, spoares.com), so this
    # subdomain needs no new certificate. Verified 2026-07-25 against the live endpoint.
    ssl_certificate     /etc/letsencrypt/live/spoares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoares.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The hub binds to the Docker gateway, not localhost — the container cannot reach 127.0.0.1.
    set $hub http://172.22.0.1:8460;

    # WebSocket endpoints. Without the Upgrade/Connection pair these silently degrade to a plain
    # request and the node never connects. read_timeout is long because these are idle-held.
    location = /api/events {
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /node/connect {
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset hashes.
    location = / {
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass $hub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}

server {
    listen 80;
    server_name citadel.spoares.com;
    return 301 https://$host$request_uri;
}
